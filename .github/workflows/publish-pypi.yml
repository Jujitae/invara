name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft GitHub release containing the sealed distributions
        required: true
        default: v0.3.0
        type: string
      expected_release_sha:
        description: Exact reviewed commit resolved by the release tag
        required: true
        type: string
      wheel_sha256:
        description: SHA-256 of the reviewed wheel
        required: true
        type: string
      sdist_sha256:
        description: SHA-256 of the reviewed source distribution
        required: true
        type: string

concurrency:
  group: publish-pypi-0.3.0
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire and verify sealed 0.3.0 distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: none
    env:
      EXPECTED_VERSION: "0.3.0"
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
      SDIST_SHA256: ${{ inputs.sdist_sha256 }}
    steps:
      - name: Download the exact sealed distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = "Jujitae/invara"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_TAG" = "v0.3.0"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]]

          main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$main_sha"
          tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_sha" = "$EXPECTED_RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = "true"

          mkdir -p pypi-dist
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "invara-0.3.0-py3-none-any.whl" \
            --pattern "invara-0.3.0.tar.gz" \
            --dir pypi-dist
          mapfile -t files < <(find pypi-dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "invara-0.3.0-py3-none-any.whl"
          test "${files[1]}" = "invara-0.3.0.tar.gz"
          printf '%s  %s\n' "$WHEEL_SHA256" pypi-dist/invara-0.3.0-py3-none-any.whl | sha256sum --check --strict
          printf '%s  %s\n' "$SDIST_SHA256" pypi-dist/invara-0.3.0.tar.gz | sha256sum --check --strict

      - name: Validate version, metadata, archive paths, and wheel RECORD
        run: |
          python3 - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import Path, PurePosixPath

          version = os.environ["EXPECTED_VERSION"]
          root = Path("pypi-dist")
          wheel = root / f"invara-{version}-py3-none-any.whl"
          sdist = root / f"invara-{version}.tar.gz"

          def safe_name(name: str) -> bool:
              path = PurePosixPath(name)
              return bool(name) and not path.is_absolute() and ".." not in path.parts and "\\" not in name

          def metadata_ok(raw: bytes, source: str) -> None:
              metadata = BytesParser(policy=compat32).parsebytes(raw)
              if metadata.get("Name") != "invara" or metadata.get("Version") != version:
                  raise SystemExit(f"{source}: unexpected Name or Version")
              mandatory = [value for value in metadata.get_all("Requires-Dist", []) if "extra ==" not in value]
              if mandatory:
                  raise SystemExit(f"{source}: mandatory runtime dependencies present")

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)) or not all(safe_name(name) for name in names):
                  raise SystemExit("wheel: duplicate or unsafe member name")
              metadata_names = [name for name in names if name.endswith(".dist-info/METADATA")]
              record_names = [name for name in names if name.endswith(".dist-info/RECORD")]
              if len(metadata_names) != 1 or len(record_names) != 1:
                  raise SystemExit("wheel: expected exactly one METADATA and one RECORD")
              metadata_ok(archive.read(metadata_names[0]), "wheel METADATA")
              rows = list(csv.reader(io.StringIO(archive.read(record_names[0]).decode("utf-8"))))
              if {row[0] for row in rows} != set(names):
                  raise SystemExit("wheel: RECORD must index exactly every member")
              for name, encoded_hash, encoded_size in rows:
                  if name == record_names[0]:
                      if encoded_hash or encoded_size:
                          raise SystemExit("wheel: RECORD self-row must omit hash and size")
                      continue
                  algorithm, digest = encoded_hash.split("=", 1)
                  if algorithm != "sha256":
                      raise SystemExit(f"wheel: unsupported RECORD hash for {name}")
                  data = archive.read(name)
                  actual = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode("ascii")
                  if actual != digest or len(data) != int(encoded_size):
                      raise SystemExit(f"wheel: RECORD mismatch for {name}")

          with tarfile.open(sdist, "r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or not all(safe_name(name) for name in names):
                  raise SystemExit("sdist: duplicate or unsafe member name")
              pkg_info = [member for member in members if member.name == f"invara-{version}/PKG-INFO"]
              if len(pkg_info) != 1:
                  raise SystemExit("sdist: expected exactly one top-level PKG-INFO")
              extracted = archive.extractfile(pkg_info[0])
              if extracted is None:
                  raise SystemExit("sdist: PKG-INFO is not a regular file")
              metadata_ok(extracted.read(), "sdist PKG-INFO")
          PY

      - name: Hand off only the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-pypi-distributions
          path: |
            pypi-dist/invara-0.3.0-py3-none-any.whl
            pypi-dist/invara-0.3.0.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    name: Reverify sealed distributions and publish to PyPI
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: none
      id-token: write
    env:
      EXPECTED_VERSION: "0.3.0"
      WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
      SDIST_SHA256: ${{ inputs.sdist_sha256 }}
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sealed-pypi-distributions
          path: pypi-dist

      - name: Revalidate filenames and sealed hashes
        run: |
          set -euo pipefail
          mapfile -t entries < <(find pypi-dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          test "${#entries[@]}" -eq 2
          test "${entries[0]}" = "invara-0.3.0-py3-none-any.whl"
          test "${entries[1]}" = "invara-0.3.0.tar.gz"
          test ! -L pypi-dist/invara-0.3.0-py3-none-any.whl
          test ! -L pypi-dist/invara-0.3.0.tar.gz
          printf '%s  %s\n' "$WHEEL_SHA256" pypi-dist/invara-0.3.0-py3-none-any.whl | sha256sum --check --strict
          printf '%s  %s\n' "$SDIST_SHA256" pypi-dist/invara-0.3.0.tar.gz | sha256sum --check --strict

      - name: Revalidate package metadata
        run: |
          python3 - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import Path

          version = os.environ["EXPECTED_VERSION"]
          root = Path("pypi-dist")

          def check(raw: bytes, source: str) -> None:
              metadata = BytesParser(policy=compat32).parsebytes(raw)
              if metadata.get("Name") != "invara" or metadata.get("Version") != version:
                  raise SystemExit(f"{source}: unexpected package identity")
              if [value for value in metadata.get_all("Requires-Dist", []) if "extra ==" not in value]:
                  raise SystemExit(f"{source}: mandatory runtime dependency present")

          with zipfile.ZipFile(root / f"invara-{version}-py3-none-any.whl") as archive:
              check(archive.read(next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))), "wheel")
          with tarfile.open(root / f"invara-{version}.tar.gz", "r:gz") as archive:
              member = archive.extractfile(f"invara-{version}/PKG-INFO")
              if member is None:
                  raise SystemExit("sdist: missing PKG-INFO")
              check(member.read(), "sdist")
          PY

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-dist/
          attestations: true
          print-hash: true

              if mandatory:
                  raise SystemExit(f"{source}: mandatory runtime dependencies present")

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)) or not all(safe_name(name) for name in names):
                  raise SystemExit("wheel: duplicate or unsafe member name")

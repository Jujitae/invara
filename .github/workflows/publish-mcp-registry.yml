name: publish-mcp-registry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact reviewed Git tag containing server.json
        required: true
        default: v0.3.0
        type: string
      expected_release_sha:
        description: Exact reviewed commit resolved by the release tag
        required: true
        type: string
      server_sha256:
        description: SHA-256 of server.json at the reviewed tag
        required: true
        type: string

concurrency:
  group: publish-mcp-registry-0.3.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish fixed INVARA 0.3.0 descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      EXPECTED_VERSION: "0.3.0"
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      SERVER_SHA256: ${{ inputs.server_sha256 }}
    steps:
      - name: Bind execution to the intended public repository and tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Jujitae/invara"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_TAG" = "v0.3.0"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          main_sha="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://api.github.com/repos/Jujitae/invara/commits/main' | jq -r .sha)"
          test "$GITHUB_SHA" = "$main_sha"
          tag_sha="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.github.com/repos/Jujitae/invara/commits/$RELEASE_TAG" | jq -r .sha)"
          test "$tag_sha" = "$EXPECTED_RELEASE_SHA"

      - name: Download the exact reviewed MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' \
            --output mcp-publisher.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' | sha256sum --check --strict
          mapfile -t members < <(tar -tzf mcp-publisher.tar.gz | LC_ALL=C sort)
          test "${members[*]}" = 'LICENSE README.md mcp-publisher'
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher

      - name: Fetch and verify the exact public 0.3.0 descriptor
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Jujitae/invara/$RELEASE_TAG/server.json" \
            --output server.json
          printf '%s  %s\n' "$SERVER_SHA256" server.json | sha256sum --check --strict
          python3 - <<'PY'
          import json
          from pathlib import Path

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          assert server["name"] == "io.github.Jujitae/invara"
          assert server["repository"] == {
              "url": "https://github.com/Jujitae/invara",
              "source": "github",
          }
          assert server["version"] == "0.3.0"
          assert len(server["packages"]) == 1
          package = server["packages"][0]
          assert package["registryType"] == "pypi"
          assert package["registryBaseUrl"] == "https://pypi.org"
          assert package["identifier"] == "invara"
          assert package["version"] == "0.3.0"
          assert package["runtimeHint"] == "uvx"
          assert package["transport"] == {"type": "stdio"}
          PY

      - name: Validate the fixed descriptor
        shell: bash
        run: ./mcp-publisher validate server.json

      - name: Authenticate to the official registry with GitHub OIDC
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish only the fixed descriptor
        shell: bash
        run: ./mcp-publisher publish server.json

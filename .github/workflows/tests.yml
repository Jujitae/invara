name: tests

on:
  push:
    # A release candidate must prove its wheel before it reaches main.  The
    # agent namespace is the dedicated candidate lane; main remains covered
    # after integration.
    branches: [main, agent/**]
  pull_request:

jobs:
  suite:
    # Both, on purpose. Two of the four failure stories in the README are
    # platform facts — a Windows cp949 console and a CRLF checkout breaking a
    # sealed digest — and a verifier that only runs on Linux would not have
    # found either.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pip install -e .
      - run: python -m pytest tests -q

  fresh-package:
    # This is intentionally separate from the editable-install suite. A
    # package can have the right source and still ship an older wheel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . --wheel-dir .runtime/invara-dist
      - run: python scripts/verify_fresh_install.py --wheel-dir .runtime/invara-dist --plugin-root plugin
